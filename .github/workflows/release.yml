name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: Bloomclient-buildable
        run: ./gradlew build --no-daemon --console=plain

      - name: Attach jar to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bloom Client ${{ github.ref_name }}
          files: Bloomclient-buildable/build/libs/clumps-*.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
